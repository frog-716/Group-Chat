[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "group-info-system"
version = "0.1.0"
description = "Evidence-traceable group chat information system MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pyyaml>=6.0,<7",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
group-info = "group_info_system.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/group_info_system"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
